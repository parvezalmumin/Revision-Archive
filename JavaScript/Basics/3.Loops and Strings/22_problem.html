<!-- Question: Print all even numbers from 0 to 100 -->

<!doctype html>
<html>
  <head>
    <title>JavaScript Practice</title>
  </head>
  <body>
    <p>Print all even numbers from 0 to 100</p>
    <script>
      for (let i = 0; i <= 100; i += 2) {
        console.log(i);
      }
    </script>
  </body>
</html>
