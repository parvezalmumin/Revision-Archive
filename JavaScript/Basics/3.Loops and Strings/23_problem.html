<!-- Question: Print all even numbers from 0 to 100 using for loop and if else -->

<!doctype html>
<html>
  <head>
    <title>Even Numbers</title>
  </head>
  <body>
    <p>Print all even numbers from 0 to 100 using for loop and if else</p>
    <script>
      for (let i = 0; i <= 100; i++) {
        if (i % 2 == 0) {
          console.log(i);
        }
      }
    </script>
  </body>
</html>
