<!doctype html>
<html>
  <head>
    <title>Odd Numbers</title>
  </head>
  <body>
    <!-- Question: Print all odd numbers from 0 to 100 using for loop and if else -->

    <script>
      for (let i = 0; i <= 100; i++) {
        if (i % 2 != 0) {
          console.log(i);
        }
      }
    </script>
  </body>
</html>
