<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const studentMethods = {
        greet: function () {
          console.log("Hello!");
        },
      };

      const student1 = {
        name: "Masho",
      };

      Object.setPrototypeOf(student1, studentMethods);

      student1.greet();
    </script>
  </body>
</html>
