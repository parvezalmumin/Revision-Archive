<!--
Give discount based on age, gender for metro ticket 
 - Females get 50% off
 - Kids under 5 years of age are free
 - Kids up to 8 years have half ticket
 - People Over 65 years of age only pay 30% of the ticket
 - In case of multiple  discouts max discount max discount will apply
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = 66;
      let gender = "Female";
      if (age < 5) {
        console.log("Free");
      } else if (age > 65) {
        console.log("Pay only 30%");
      } else if (gender === "Female") {
        console.log("50% Off");
      } else if (age <= 8) {
        console.log("Half Ticket");
      } else {
        console.log("Full Ticket");
      }
    </script>
  </body>
</html>
