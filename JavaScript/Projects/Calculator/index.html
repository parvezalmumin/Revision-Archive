<!doctype html>
<html lang="en">
  <head>
    <title>Calculaor</title>
    <!--External CSS file connected here -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculaor-container">
      <input type="text" id="display" readonly />

      <div class="button-container">
        <button
          class="button"
          onclick="
            calcScreen = ``;
            document.querySelector('#display').value = calcScreen;
          "
        >
          C
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `1`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          1
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `2`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          2
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `+`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          +
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `3`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          3
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `4`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          4
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `-`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          -
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `5`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          5
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `6`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          6
        </button>
        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `*`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          *
        </button>
        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `7`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          7
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `8`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          8
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `/`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          /
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `9`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          9
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `0`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          0
        </button>

        <button
          class="button"
          onclick="
            calcScreen = calcScreen + `.`;
            document.querySelector('#display').value = calcScreen;
          "
        >
          .
        </button>

        <button
          class="button"
          onclick="
            calcScreen = eval(calcScreen);
            document.querySelector('#display').value = calcScreen;
          "
        >
          =
        </button>
      </div>
    </div>

    <!--External JS file connected here -->
    <script src="script.js"></script>
  </body>
</html>
